# Builds this repository's payload — liblimnsvg, lunasvg and plutovg compiled into Limn's JNI shim,
# for all six desktop slices — and hands it back as artifacts. Nothing here is committed: the
# binaries exist for the length of a run and travel into the jars the release publishes.
#
# `scripts/build-lunasvg.sh` does the work; this file only supplies each slice the machine and the
# toolchain it cannot cross-compile from anywhere else:
#
#   macOS      one job, two slices, from an Apple Silicon runner (`--arch arm64,x86_64`).
#   Linux      a manylinux_2_28 container, NOT the runner's own userland: the script refuses a
#              library that needs a glibc newer than 2.28, which is what a current distribution's
#              compiler produces (an Ubuntu 24.04 build asked for 2.38). Each architecture on its
#              own native runner.
#   Windows    MSYS2 with clang, CLANG64 for x86_64 and CLANGARM64 for arm64, linking the C++
#              runtime statically so the DLL imports Windows and nothing else.
#
# The fuzz ADR 066 asks of every lunasvg this repository packages runs where fork() exists, on the
# macOS and Linux slices, against the same release objects that went into the library.
#
# Reusable (`workflow_call`) so the release calls it and its artifacts land in the same run, and
# dispatchable on its own.

name: natives

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.slice }}
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: macos
            runs-on: macos-latest
            args: --arch arm64,x86_64
            fuzz: true
          - slice: linux-x86_64
            runs-on: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            fuzz: true
          - slice: linux-aarch64
            runs-on: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            fuzz: true
          - slice: windows-x86_64
            runs-on: windows-latest
            msystem: CLANG64
            pacboy: clang:p
          - slice: windows-aarch64
            runs-on: windows-11-arm
            msystem: CLANGARM64
            pacboy: clang:p

    steps:
      - uses: actions/checkout@v7

      # A JDK for jni.h: a manylinux container ships none, and the script's architecture probe and
      # its jni.h check both need one.
      - name: Install a JDK (manylinux)
        if: startsWith(matrix.slice, 'linux')
        run: |
          dnf install -y --setopt=install_weak_deps=False diffutils file which java-17-openjdk-devel
          echo "javac: $(command -v javac)"

      - uses: msys2/setup-msys2@v2
        if: startsWith(matrix.slice, 'windows')
        with:
          msystem: ${{ matrix.msystem }}
          # base-devel for the binutils whose objdump the import check calls; clang for the
          # compilers, the linker and the static C++ runtime. Nothing else is needed.
          install: base-devel
          pacboy: ${{ matrix.pacboy }}

      - name: Build liblimnsvg
        if: ${{ !startsWith(matrix.slice, 'windows') }}
        run: bash scripts/build-lunasvg.sh ${{ matrix.args }}

      - name: Build liblimnsvg (MSYS2)
        if: startsWith(matrix.slice, 'windows')
        shell: msys2 {0}
        run: bash scripts/build-lunasvg.sh

      - name: Fuzz the release objects
        if: matrix.fuzz
        run: bash scripts/fuzz.sh 6000 1 5

      - name: Show what was produced
        run: ls -lR native/dist

      - uses: actions/upload-artifact@v7
        with:
          name: lunasvg-native-${{ matrix.slice }}
          path: native/dist/
          if-no-files-found: error
          retention-days: 1
