# The version the NEXT release carries — the single place it is written.
#
# Two readers of one file: build.gradle.kts turns it into the default (-SNAPSHOT) version, and
# the tag-releases workflow turns it into the tag `v<version>` on every push to main, creating
# and publishing it if it does not exist yet. Releasing is: bump this (with the lunasvg pin in
# scripts/build-lunasvg.sh, if the pin moved), commit, push. Nobody types or pushes a tag.
#
# The scheme: the first three components ARE the lunasvg version the script pins (the build
# refuses a mismatch), and the fourth is this repository's own: a shim change or a rebuild of the
# same lunasvg spends it. So 3.5.0.0 is lunasvg 3.5.0 as first packaged.
limn-lunasvg-natives=3.5.0.0
